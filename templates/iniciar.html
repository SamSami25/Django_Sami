{% extends "base.html" %}
{% block title %}Iniciar Test{% endblock %}
{% block content %}
<h2>1) Tu información</h2>
<form method="post" class="card">
  {% csrf_token %}
  <div class="field">{{ form.nombre.label_tag }} {{ form.nombre }}</div>
  <div class="field">
    <label>Género</label>
    {{ form.genero }}
  </div>
  <button class="btn" type="submit">Ir a preguntas</button>
</form>
{% endblock %}
