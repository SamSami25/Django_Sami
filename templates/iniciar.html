{% extends "base.html" %}
{% block title %}Iniciar Test{% endblock %}

{% block content %}
<h2>1) Tu información</h2>
<form method="post" class="card">
  {% csrf_token %}

  <!-- Campo Nombre -->
  <div class="field">
    {{ form.nombre.label_tag }}
    {{ form.nombre }}
  </div>

  <!-- Campo Género -->
  <div class="field">
    {{ form.genero.label_tag }}
    <div class="radio-group">
      {{ form.genero }}
    </div>
  </div>

  <button class="btn" type="submit">Ir a preguntas</button>
</form>

<style>
.card {
    background: #fce7f3;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    max-width: 400px;
    margin: 20px auto;
}

.field {
    margin-bottom: 15px;
    text-align: left;
}

.radio-group input[type="radio"] {
    margin-right: 8px;
    transform: scale(1.2);
}

.btn {
    background: #9d174d;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #7c3aed;
}
</style>
{% endblock %}
