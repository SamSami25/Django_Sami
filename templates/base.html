{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Django_Sami{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="nav">
    <div class="container">
      <a class="brand" href="/">Django_Sami</a>
      <nav>
        <a href="/">Inicio</a>
        <a href="/iniciar/">Test</a>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% if messages %}
      <ul class="msgs">
        {% for m in messages %}<li class="msg {{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Hecho con cariño 💜 — Pasteles, seguridad y autoestima.
  </footer>
</body>
</html>
